<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MEI Horizontal Score Follower</title>

<script src="https://www.verovio.org/javascript/latest/verovio-toolkit.js"></script>

<style>
  body {
    margin: 0;
    font-family: sans-serif;
  }

  header {
    height: 70px;
    padding: 10px;
    border-bottom: 1px solid #ccc;
    background: #fff;
    box-sizing: border-box;
  }

  #audio {
    width: 100%;
  }

  /* ✅ Horizontal scrolling container */
  #score-container {
    height: calc(100vh - 80px);
    overflow-x: auto;
    overflow-y: hidden;
    background: #fafafa;
  }

  /* ✅ Let SVG grow horizontally */
  #score svg {
    height: 100%;
    width: auto;
    display: block;
  }

  /* Highlight */
  .highlight * {
    stroke: red !important;
    fill: orange !important;
  }

  /* Optional playhead line (nice visual anchor) */
  #playhead {
    position: fixed;
    top: 80px;
    bottom: 0;
    left: 50%;
    width: 2px;
    background: red;
    pointer-events: none;
  }
</style>
</head>

<body>

<header>
  <audio id="audio" controls></audio>
</header>

<div id="score-container">
  <div id="score"></div>
</div>

<div id="playhead"></div>

<script>
class HorizontalScoreFollower {
  constructor(meiUrl, scale = 50) {
    this.meiUrl = meiUrl;
    this.scale = scale;

    this.tk = new verovio.toolkit();
    this.audio = document.getElementById("audio");
    this.scoreDiv = document.getElementById("score");
    this.container = document.getElementById("score-container");

    this.clips = [];
    this.currentIndex = -1;

    this.init();
  }

  async init() {
    let meiText = await fetch(this.meiUrl).then(r => r.text());

    // ✅ Strip page + system breaks
    meiText = meiText
      .replace(/<pb[^>]*>/g, "")
      .replace(/<sb[^>]*>/g, "");

    const xml = new DOMParser().parseFromString(meiText, "text/xml");

    this.loadAudio(xml);
    this.loadClips(xml);

    this.tk.setOptions({
      scale: this.scale,
      breaks: "none",
      pageWidth: 200000,
      adjustPageHeight: true,
      spacingLinear: 0.25
    });

    this.tk.loadData(meiText);

    this.render();

    window.addEventListener("resize", () => this.render());

    // ✅ CHANGED: start smooth animation loop
    requestAnimationFrame(() => this.animate());
  }

  loadAudio(xml) {
    const av = xml.querySelector("recording avFile");
    if (av) {
      this.audio.src = av.getAttribute("target");
    }
  }

  loadClips(xml) {
    xml.querySelectorAll("recording clip").forEach(c => {
      const start = this.toSec(c.getAttribute("begin"));
      const end = this.toSec(c.getAttribute("end"));
      const id = c.getAttribute("startid")?.replace("#", "");

      if (id) this.clips.push({ start, end, id });
    });

    this.clips.sort((a, b) => a.start - b.start);
  }

  toSec(t) {
    const [h, m, s] = t.split(":");
    return (+h)*3600 + (+m)*60 + parseFloat(s);
  }

  render() {
    this.tk.setOptions({
      scale: 30,
      breaks: "none",
      pageWidth: 200000,
      adjustPageHeight: true
    });

    let svg = this.tk.renderToSVG(1);
    this.scoreDiv.innerHTML = svg;

    const renderedSVG = this.scoreDiv.querySelector("svg");
    const svgHeight = renderedSVG.getBoundingClientRect().height;
    const containerHeight = this.container.clientHeight;

    const scaleFactor = containerHeight / svgHeight;
    const newScale = 30 * scaleFactor;

    this.tk.setOptions({
      scale: newScale,
      breaks: "none",
      pageWidth: 200000,
      adjustPageHeight: true
    });

    svg = this.tk.renderToSVG(1);
    this.scoreDiv.innerHTML = svg;
  }

  // ✅ NEW: smooth animation loop
  animate() {
    const t = this.audio.currentTime;

    for (let i = 0; i < this.clips.length; i++) {
      const c = this.clips[i];

      if (t >= c.start && t < c.end) {
        if (i !== this.currentIndex) {
          this.currentIndex = i;
          this.highlight(c.id);
        }

        // ✅ smooth motion happens here
        this.smoothScroll(c, t);

        break;
      }
    }

    requestAnimationFrame(() => this.animate());
  }

  highlight(id) {
    const svg = this.scoreDiv.querySelector("svg");

    svg.querySelectorAll(".highlight")
      .forEach(el => el.classList.remove("highlight"));

    const el = svg.querySelector(`[id="${id}"]`);
    if (!el) return;

    const measure = el.closest(".measure");
    const target = measure || el;

    target.classList.add("highlight");
  }

  // ✅ NEW: smooth scrolling calculation
  smoothScroll(c, t) {
    const el = this.scoreDiv.querySelector(`[id="${c.id}"]`);
    if (!el) return;

    const rect = el.getBoundingClientRect();
    const containerRect = this.container.getBoundingClientRect();

    const progress = (t - c.start) / (c.end - c.start);

    const baseLeft =
      rect.left - containerRect.left + this.container.scrollLeft;

    const targetX = baseLeft + rect.width * progress;

    const center = this.container.clientWidth / 2;

    this.container.scrollTo({
      left: targetX - center,
      behavior: "auto"
    });
  }
}

// ✅ your existing init line
new HorizontalScoreFollower("data/dufay.mei", 50);
</script>

</body>
</html>
