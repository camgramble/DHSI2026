<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MEI Clip-Based Sync Player</title>

<script src="https://www.verovio.org/javascript/latest/verovio-toolkit.js"></script>

<style>
  body { font-family: sans-serif; }
  #score { border: 1px solid #ccc; padding: 10px; }

  .highlight {
    stroke: red !important;
    fill: orange !important;
  }
</style>
</head>

<body>

<h2>MEI + Audio Synchronization</h2>

<audio id="audio" controls></audio>
<div id="score"></div>

<script>
const tk = new verovio.toolkit();
let clips = [];

// Convert HH:MM:SS.xx → seconds
function timeToSeconds(t) {
  const parts = t.split(":");
  return (
    parseFloat(parts[0]) * 3600 +
    parseFloat(parts[1]) * 60 +
    parseFloat(parts[2])
  );
}

// Load MEI
fetch("data/dufay.mei")
  .then(res => res.text())
  .then(meiText => {
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(meiText, "text/xml");

    // 1. Get audio from <avFile target="">
    const audioFile = xmlDoc.querySelector("recording avFile");
    if (audioFile) {
      document.getElementById("audio").src =
        audioFile.getAttribute("target");
    }

    // 2. Extract all clips
    xmlDoc.querySelectorAll("recording clip").forEach(c => {
      const start = timeToSeconds(c.getAttribute("begin"));
      const end = timeToSeconds(c.getAttribute("end"));
      const target = c.getAttribute("startid");

      if (target) {
        clips.push({
          start,
          end,
          id: target.replace("#", "")
        });
      }
    });

    // Sort clips by time
    clips.sort((a, b) => a.start - b.start);

    // 3. Render score
    tk.loadData(meiText);
    const svg = tk.renderToSVG(1, {});
    document.getElementById("score").innerHTML = svg;
  });

// Highlight function
function highlightElement(xmlId) {
  const svg = document.querySelector("#score svg");

  svg.querySelectorAll(".highlight").forEach(el =>
    el.classList.remove("highlight")
  );

  const el = svg.querySelector(`[id="${xmlId}"]`);
  if (el) {
    el.querySelectorAll("*").forEach(child =>
      child.classList.add("highlight")
    );

    el.scrollIntoView({ behavior: "smooth", block: "center" });
  }
}

// 4. Sync audio → score
const audio = document.getElementById("audio");

audio.addEventListener("timeupdate", () => {
  const t = audio.currentTime;

  for (let i = 0; i < clips.length; i++) {
    const c = clips[i];

    if (t >= c.start && t < c.end) {
      highlightElement(c.id);
      break;
    }
  }
});
</script>

</body>
</html>
