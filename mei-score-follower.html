<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MEI Continuous Score Follower</title>

<script src="https://www.verovio.org/javascript/latest/verovio-toolkit.js"></script>

<style>
  body {
    margin: 0;
    font-family: sans-serif;
  }

  header {
    padding: 10px;
    background: #fff;
    border-bottom: 1px solid #ccc;
  }

  #audio {
    width: 100%;
  }

#score-container {
  height: calc(100vh - 80px);
  overflow-x: auto;        /* ✅ horizontal scroll */
  overflow-y: hidden;      /* ✅ no vertical scroll */
  white-space: nowrap;
  background: #fafafa;
}

#score svg {
  height: 100%;            /* ✅ fill vertical space */
  width: auto;             /* ✅ expand horizontally */
  display: block;
}
  .highlight * {
    stroke: red !important;
    fill: orange !important;
  }
</style>
</head>

<body>

<header>
  <audio id="audio" controls></audio>
</header>

<div id="score-container">
  <div id="score"></div>
</div>

<script>
class ScoreFollower {
  constructor(meiUrl, scale = 40) {
    this.meiUrl = meiUrl;
    this.scale = scale;

    this.tk = new verovio.toolkit();
    this.audio = document.getElementById("audio");
    this.scoreDiv = document.getElementById("score");
    this.container = document.getElementById("score-container");

    this.clips = [];
    this.currentIndex = -1;

    this.init();
  }

  async init() {
    let meiText = await fetch(this.meiUrl).then(r => r.text());

    // ✅ HARD FIX: remove page/system breaks + normalize whitespace
    meiText = meiText
      .replace(/<pb[^>]*>/g, "")
      .replace(/<sb[^>]*>/g, "")
      .replace(/\s+/g, " ");

    const xml = new DOMParser().parseFromString(meiText, "text/xml");

    this.loadAudio(xml);
    this.loadClips(xml);

    // ✅ VERY IMPORTANT: set options BEFORE loading data
    this.tk.setOptions({
      scale: this.scale,
      breaks: "none",
      adjustPageHeight: true,
      pageWidth: this.container.clientWidth * 100,
      spacingLinear: 0.25,
      systemSpacing: 160,
      staffSpacing: 80
    });

    this.tk.loadData(meiText);

    // ✅ Debug (you can check this in console)
    console.log("Page count after cleaning:", this.tk.getPageCount());

    this.render();

    window.addEventListener("resize", () => this.render());
    this.audio.addEventListener("timeupdate", () => this.sync());
  }

  loadAudio(xml) {
    const av = xml.querySelector("recording avFile");
    if (av) {
      this.audio.src = av.getAttribute("target");
    }
  }

  loadClips(xml) {
    xml.querySelectorAll("recording clip").forEach(c => {
      const start = this.toSec(c.getAttribute("begin"));
      const end = this.toSec(c.getAttribute("end"));
      const id = c.getAttribute("startid")?.replace("#", "");

      if (id) this.clips.push({ start, end, id });
    });

    this.clips.sort((a, b) => a.start - b.start);
  }

  toSec(t) {
    const [h, m, s] = t.split(":");
    return (+h)*3600 + (+m)*60 + parseFloat(s);
  }

 render() {
  this.tk.setOptions({
    scale: this.scale,
    breaks: "none",
    adjustPageHeight: true,

    // ✅ Critical: EXTREMELY wide page
    pageWidth: 200000,

    spacingLinear: 0.25,
    systemSpacing: 160,
    staffSpacing: 80
  });

  const svg = this.tk.renderToSVG(1);
  this.scoreDiv.innerHTML = svg;
}

  sync() {
    const t = this.audio.currentTime;

    for (let i = 0; i < this.clips.length; i++) {
      const c = this.clips[i];

      if (t >= c.start && t < c.end) {
        if (i !== this.currentIndex) {
          this.currentIndex = i;
          this.highlight(c.id);
        }
        break;
      }
    }
  }

  highlight(id) {
    const svg = this.scoreDiv.querySelector("svg");

    svg.querySelectorAll(".highlight")
      .forEach(el => el.classList.remove("highlight"));

    const el = svg.querySelector(`[id="${id}"]`);
    if (!el) return;

    const measure = el.closest(".measure");
    const target = measure || el;

    target.classList.add("highlight");

    this.scrollTo(target);
  }

 scrollTo(el) {
  const cRect = this.container.getBoundingClientRect();
  const eRect = el.getBoundingClientRect();

  const offset = eRect.left - cRect.left - cRect.width / 2;

  this.container.scrollBy({
    left: offset,
    behavior: "smooth"
    });
  }
}

// ✅ CHANGE ONLY THIS
new ScoreFollower("data/dufay.mei", 40);
</script>

</body>
</html>
